<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MayLamDi helps university teams plan fairly, track progress, and preserve contribution evidence."
    />
    <meta name="theme-color" content="#fffded" />
    <link rel="icon" type="image/png" href="/assets/maylamdi-logo.png" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("maylamdi-theme");
          const dark = matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme =
            saved === "light" || saved === "dark"
              ? saved
              : dark
                ? "dark"
                : "light";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <title>MayLamDi — Shared projects, fairly planned</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
